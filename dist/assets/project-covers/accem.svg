<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">ACCEM cryo-electron microscopy facility cover</title>
  <desc id="desc">A dark navy facility portal cover with cryo-EM workflow and live ACCEM statistics.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06152f"/><stop offset="1" stop-color="#0b3157"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#10294a"/><stop offset="1" stop-color="#091b34"/></linearGradient>
    <linearGradient id="glow"><stop stop-color="#39c9e5"/><stop offset="1" stop-color="#1974d2"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#29c8ef" stop-opacity=".24"/><stop offset="1" stop-color="#29c8ef" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1440" height="850" fill="url(#bg)"/>
  <circle cx="1150" cy="285" r="440" fill="url(#halo)"/>
  <path d="M0 688h1440v162H0z" fill="#f6fafc"/>
  <path d="M0 687h1440" stroke="#42c8e8" stroke-opacity=".7" stroke-width="3"/>
