<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">TEM booking terminal cover</title>
  <desc id="desc">A light electron microscopy booking dashboard with a microscope illustration and shared-operator schedule.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eff2ff"/><stop offset="1" stop-color="#dfe5ff"/></linearGradient>
    <linearGradient id="sidebar" x2="0" y2="1"><stop stop-color="#090f27"/><stop offset="1" stop-color="#151d43"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#526fff"/><stop offset="1" stop-color="#7c45ec"/></linearGradient>
    <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset=".55" stop-color="#aeb8cc"/><stop offset="1" stop-color="#707d98"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#142044" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1440" height="850" fill="url(#bg)"/>
  <path d="M0 0h284v850H0z" fill="url(#sidebar)"/>
  <g font-family="Arial, sans-serif">
    <rect x="35" y="35" width="56" height="56" rx="16" fill="url(#accent)"/>
    <circle cx="63" cy="63" r="12" fill="none" stroke="#fff" stroke-width="3"/><path d="M63 44v7m0 24v7M44 63h7m24 0h7" stroke="#fff" stroke-width="3"/>
    <text x="110" y="61" fill="#f8f9ff" font-size="22" font-weight="700">EM Facility</text>
    <text x="110" y="84" fill="#9ba6c3" font-size="15">Excellence in Microscopy</text>
    <rect x="24" y="133" width="235" height="55" rx="12" fill="#202a61" stroke="#5169f6"/>
    <text x="58" y="168" fill="#fff" font-size="18" font-weight="700">Dashboard</text>
    <g fill="#adb6cd" font-size="17">
      <text x="58" y="237">Instruments</text><text x="58" y="300">User Forms</text><text x="58" y="363">My Bookings</text><text x="58" y="426">Guidelines &amp; SOPs</text><text x="58" y="489">Help &amp; Support</text>
    </g>
    <rect x="28" y="664" width="226" height="150" rx="14" fill="#171f42" stroke="#343f6e"/>
    <text x="49" y="698" fill="#c2ccff" font-size="14" font-weight="700" letter-spacing="1">BOOKING WINDOW</text>
    <text x="49" y="735" fill="#f4f6ff" font-size="19" font-weight="700">48-hour window</text>
    <text x="49" y="768" fill="#aeb9d3" font-size="15">Friday noon – Sunday</text>
    <text x="49" y="791" fill="#aeb9d3" font-size="15">First-come, first-served</text>
    <rect x="324" y="52" width="1075" height="415" rx="30" fill="#fbfcff" filter="url(#shadow)"/>
    <circle cx="365" cy="428" r="120" fill="#7585ff" opacity=".1"/>
    <text x="370" y="128" fill="#6571b7" font-size="15" font-weight="700" letter-spacing="3">FACILITY BOOKING PORTAL</text>
    <text x="370" y="190" fill="#101944" font-size="42" font-weight="700">Electron Microscopy Facility</text>
    <text x="370" y="231" fill="#4e5875" font-size="20">Operator-assisted access for your research.</text>
    <text x="370" y="262" fill="#4e5875" font-size="20">Talos L120C TEM + Leica UC7 Ultra Microtome</text>
    <rect x="370" y="294" width="186" height="39" rx="20" fill="#eef0ff"/><text x="463" y="319" fill="#363f83" font-size="14" font-weight="700" text-anchor="middle">2 INSTRUMENTS</text>
    <rect x="568" y="294" width="220" height="39" rx="20" fill="#eef0ff"/><text x="678" y="319" fill="#363f83" font-size="14" font-weight="700" text-anchor="middle">1 SHARED OPERATOR</text>
    <g filter="url(#shadow)">
      <path d="M1102 363h218l-20 31h-180z" fill="#737f9a"/>
      <rect x="1140" y="153" width="143" height="213" rx="14" fill="url(#metal)" stroke="#99a4b9" stroke-width="3"/>
      <rect x="1161" y="182" width="100" height="112" rx="5" fill="#e6ebf2"/>
      <text x="1211" y="205" fill="#c62828" font-size="13" font-weight="700" text-anchor="middle">THERMO</text>
      <circle cx="1211" cy="270" r="25" fill="#1a2030"/><circle cx="1211" cy="270" r="12" fill="#45516a"/><circle cx="1211" cy="270" r="4" fill="#d4d9e0"/>
      <text x="1211" y="321" fill="#39445c" font-size="12" text-anchor="middle">TALOS L120C</text>
      <rect x="1180" y="357" width="65" height="13" rx="4" fill="#67748e"/>
    </g>
    <rect x="324" y="501" width="1075" height="295" rx="23" fill="#fff" stroke="#d2d8e7"/>
    <text x="365" y="550" fill="#171d35" font-size="23" font-weight="700">Upcoming Week Availability</text>
    <text x="1355" y="550" fill="#66708a" font-size="16" text-anchor="end">SHARED-OPERATOR SCHEDULE</text>
    <g font-family="Arial,sans-serif" text-anchor="middle" font-weight="700">
      <rect x="365" y="585" width="176" height="66" rx="13" fill="url(#accent)"/><text x="453" y="611" fill="#fff" font-size="14">MON</text><text x="453" y="637" fill="#fff" font-size="23">01</text>
      <rect x="554" y="585" width="176" height="66" rx="13" fill="#f7f8fc" stroke="#d8ddea"/><text x="642" y="611" fill="#68728a" font-size="14">TUE</text><text x="642" y="637" fill="#202843" font-size="23">02</text>
      <rect x="743" y="585" width="176" height="66" rx="13" fill="#f7f8fc" stroke="#d8ddea"/><text x="831" y="611" fill="#68728a" font-size="14">WED</text><text x="831" y="637" fill="#202843" font-size="23">03</text>
      <rect x="932" y="585" width="176" height="66" rx="13" fill="#f7f8fc" stroke="#d8ddea"/><text x="1020" y="611" fill="#68728a" font-size="14">THU</text><text x="1020" y="637" fill="#202843" font-size="23">04</text>
      <rect x="1121" y="585" width="236" height="66" rx="13" fill="#f7f8fc" stroke="#d8ddea"/><text x="1239" y="611" fill="#68728a" font-size="14">FRI</text><text x="1239" y="637" fill="#202843" font-size="23">05</text>
    </g>
    <text x="367" y="696" fill="#28324e" font-size="17" font-weight="700">TALOS L120C TEM</text>
    <text x="871" y="696" fill="#28324e" font-size="17" font-weight="700">LEICA UC7 ULTRAMICROTOME</text>
    <rect x="365" y="716" width="455" height="48" rx="10" fill="#e4f5ec"/><text x="592" y="746" fill="#228455" font-size="16" font-weight="700" text-anchor="middle">AVAILABLE SESSION</text>
    <rect x="839" y="716" width="518" height="48" rx="10" fill="#f0e8ff"/><text x="1098" y="746" fill="#6840b3" font-size="16" font-weight="700" text-anchor="middle">OPERATOR-COORDINATED BOOKING</text>
  </g>
</svg>
